openapi: 3.0.3
info:
  title: Barbearia Tio Preto - API
  version: 0.1.0
  description: |
    Contrato único da API (v0, sem back implementado). O front mockado segue este contrato.
    E-01, E-02 e E-03 estão detalhados. E-04 e E-05 estão marcados "v0.1 provisório".

    Convenções:
    - Telefone sempre E.164 (+5544999990000).
    - Data e hora em ISO 8601 com fuso, America/Sao_Paulo (-03:00).
    - Dinheiro em centavos (priceCents).
    - Erro sempre no formato {code, message, details}.

    Decisões de negócio (apostas a validar com o Tio Preto - ver contrato/questionamentos.md):
    - Pedido pendente NÃO segura o horário. Aprovar um segundo pedido no mesmo horário devolve 409 SLOT_UNAVAILABLE.
    - Prazo de cancelamento é lido na hora do acesso ao link (cancelDeadlineAt). Dentro do prazo
      o cliente cancela sozinho; fora dele, o valor do agendamento é cobrado (cobrança fora do sistema).
    - Ao remarcar ou propor outro horário, o horário antigo continua confirmado até o dono aprovar o novo.
    - Um pedido junta vários serviços (itemIds), no máximo um por grupo: um tipo de cabelo,
      uma barba, uma sobrancelha.
    - Duração do atendimento: serviço com durationMinutes menor que slotMinutes (sobrancelha) encaixa
      junto de outro serviço sem somar tempo e, sozinho, ocupa um horário inteiro. Os demais somam.
      O total arredonda para cima em slotMinutes e respeita maxServiceMinutes.
      Ex. (slot 30, teto 60): cabelo+sobrancelha = 30; cabelo+barba+sobrancelha = 60;
      sobrancelha sozinha = 30; wold money ou visagista, com ou sem barba = 60.
    - A agenda abre horizonWeeks semanas para frente. É essa variável que o site mostra como
      "agenda aberta para as próximas N semanas"; não é aviso.
    - O aviso do dia (notice) vale só para noticeDate e sai do ar sozinho depois da meia-noite.
    - Mudança de horário padrão ou exceção que deixa horário marcado para fora cancela esses
      pedidos e marca needsAdjust: o dono resolve cada caso no WhatsApp (remarcar ou excluir).
    - Produto (kind=produto) aparece no cardápio mas não entra em agendamento.
    - Quem avisa o cliente é a API do WhatsApp, pelo próprio sistema, a cada mudança de estado
      (recebido, confirmado, recusado, outro horário proposto, remarcado, cancelado). O dono não
      precisa mandar mensagem na mão: o contato direto dele é exceção (número errado, cliente
      bloqueado, horário derrubado por mudança de agenda). Cada mensagem enviada fica registrada
      em messages, e é isso que o cliente vê na página do pedido.
servers:
  - url: https://api.tiopretobarbearia.com/v0
tags:
  - name: E-01 Cardápio público
  - name: E-02 Painel do dono
  - name: E-03 Horário e aviso
  - name: E-04 Agenda (v0.1 provisório)
  - name: E-05 Faltas (v0.1 provisório)
paths:
  /public/menu:
    get:
      tags: [E-01 Cardápio público]
      summary: Itens visíveis do cardápio, mais contatos e aviso do dia
      responses:
        '200':
          description: Cardápio público
          content:
            application/json:
              schema:
                type: object
                required: [items, contacts, notice]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MenuItem' }
                  contacts: { $ref: '#/components/schemas/Contacts' }
                  notice: { type: string, nullable: true, description: Aviso do dia; some sozinho depois da meia-noite. }
                  horizonWeeks: { type: integer, description: Semanas de agenda abertas ao cliente. }
  /auth/login:
    post:
      tags: [E-02 Painel do dono]
      summary: Login do dono. Limite de tentativas, cookie seguro.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '204': { description: Autenticado (cookie de sessão) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /admin/menu:
    get:
      tags: [E-02 Painel do dono]
      summary: Todos os itens, inclusive ocultos
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Itens
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MenuItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [E-02 Painel do dono]
      summary: Cria item
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuItemInput' }
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MenuItem' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/menu/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      tags: [E-02 Painel do dono]
      summary: Edita ou oculta item
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuItemInput' }
      responses:
        '200':
          description: Atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MenuItem' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [E-02 Painel do dono]
      summary: Remove item
      security: [{ cookieAuth: [] }]
      responses:
        '204': { description: Removido }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/settings:
    get:
      tags: [E-03 Horário e aviso]
      summary: Horário padrão, exceções, aviso e prazo de cancelamento
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Configuração
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [E-03 Horário e aviso]
      summary: Atualiza configuração
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Settings' }
      responses:
        '200':
          description: |
            Atualizada. cancelledRequests traz os pedidos que ficaram fora do novo horário:
            eles vão para cancelado com needsAdjust e esperam o dono resolver no WhatsApp.
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings: { $ref: '#/components/schemas/Settings' }
                  cancelledRequests:
                    type: array
                    items: { $ref: '#/components/schemas/AdminRequest' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /public/slots:
    get:
      tags: [E-03 Horário e aviso]
      summary: Horários livres de um dia. Só "confirmado", "atendido" e "bloqueado" ocupam.
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
        - name: itemIds
          in: query
          required: true
          description: Um ou mais serviços do mesmo pedido. A duração é calculada pelo conjunto.
          schema: { type: array, items: { type: string } }
      responses:
        '200':
          description: Horários
          content:
            application/json:
              schema:
                type: object
                properties:
                  date: { type: string, format: date }
                  durationMinutes: { type: integer, description: Duração total do conjunto de serviços. }
                  slots:
                    type: array
                    items: { $ref: '#/components/schemas/Slot' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /public/requests:
    post:
      tags: [E-04 Agenda (v0.1 provisório)]
      summary: Cliente pede horário. Número bloqueado recebe resposta neutra.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRequest' }
      responses:
        '201':
          description: Pedido recebido (pendente)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicRequest' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/SlotUnavailable' }
        '422': { $ref: '#/components/responses/OutsideHours' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /public/requests/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    get:
      tags: [E-04 Agenda (v0.1 provisório)]
      summary: Consulta o pedido pelo link. Devolve cancelDeadlineAt.
      responses:
        '200':
          description: Pedido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [E-04 Agenda (v0.1 provisório)]
      summary: Cancela pelo link. Prazo checado no servidor.
      responses:
        '204': { description: Cancelado }
        '403': { $ref: '#/components/responses/DeadlinePassed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
  /public/requests/{token}/reschedule:
    post:
      tags: [E-04 Agenda (v0.1 provisório)]
      summary: Pede remarcação. O horário antigo continua confirmado até o dono aprovar.
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startAt]
              properties:
                startAt: { type: string, format: date-time }
      responses:
        '200':
          description: Pedido de remarcação registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicRequest' }
        '403': { $ref: '#/components/responses/DeadlinePassed' }
        '409': { $ref: '#/components/responses/SlotUnavailable' }
  /admin/requests:
    get:
      tags: [E-04 Agenda (v0.1 provisório)]
      summary: Pedidos e agenda
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/RequestStatus' } }
      responses:
        '200':
          description: Pedidos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [E-04 Agenda (v0.1 provisório)]
      summary: Cadastro manual (cliente atendido pelo WhatsApp). Nasce confirmado.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRequest' }
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminRequest' }
        '409': { $ref: '#/components/responses/SlotUnavailable' }
  /admin/requests/{id}/transition:
    post:
      tags: [E-04 Agenda (v0.1 provisório)]
      summary: Muda o estado. Revalida o horário de forma atômica ao confirmar.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { $ref: '#/components/schemas/RequestStatus' }
                proposedStartAt: { type: string, format: date-time }
      responses:
        '200':
          description: Atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminRequest' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
  /admin/requests/{id}/move:
    post:
      tags: [E-04 Agenda (v0.1 provisório)]
      summary: Dono muda o horário de um pedido direto na agenda e limpa needsAdjust.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startAt]
              properties:
                startAt: { type: string, format: date-time }
      responses:
        '200':
          description: Remarcado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminRequest' }
        '409': { $ref: '#/components/responses/SlotUnavailable' }
        '422': { $ref: '#/components/responses/OutsideHours' }
  /admin/requests/{id}/resolve-adjust:
    post:
      tags: [E-04 Agenda (v0.1 provisório)]
      summary: Tira o pedido da fila de ajustes sem remarcar.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Resolvido }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/blocked-numbers:
    get:
      tags: [E-04 Agenda (v0.1 provisório)]
      summary: Números bloqueados
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Lista
          content:
            application/json:
              schema:
                type: array
                items: { type: string, description: E.164 }
    put:
      tags: [E-04 Agenda (v0.1 provisório)]
      summary: Substitui a lista de números bloqueados
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { type: string }
      responses:
        '204': { description: Salvo }
  /admin/clients:
    get:
      tags: [E-05 Faltas (v0.1 provisório)]
      summary: Clientes (por WhatsApp) com histórico de faltas
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Clientes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Client' }
components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: session }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string }
        details: { type: object, additionalProperties: true }
    ErrorCode:
      type: string
      enum:
        - SLOT_UNAVAILABLE
        - OUTSIDE_BUSINESS_HOURS
        - VALIDATION_ERROR
        - DEADLINE_PASSED
        - UNAUTHORIZED
        - REQUEST_NOT_ACCEPTED
        - INVALID_TRANSITION
        - NOT_FOUND
        - TOO_MANY_REQUESTS
    ItemKind:
      type: string
      description: servico ocupa horário na agenda; produto é só venda no cardápio.
      enum: [servico, produto]
    ServiceGroup:
      type: string
      description: |
        Grupo do serviço. O cliente escolhe no máximo um item por grupo.
        "outro" não tem limite.
      enum: [cabelo, barba, sobrancelha, outro]
    MenuItem:
      type: object
      required: [id, kind, name, priceCents, priceType, durationMinutes, visible, photoUrls]
      properties:
        id: { type: string }
        kind: { $ref: '#/components/schemas/ItemKind' }
        group: { $ref: '#/components/schemas/ServiceGroup' }
        name: { type: string }
        description: { type: string }
        priceCents: { type: integer, minimum: 1 }
        priceType: { type: string, enum: [fixed, from] }
        durationMinutes:
          type: integer
          default: 30
          description: 0 em produto. Menor que slotMinutes significa encaixe (sobrancelha).
        visible: { type: boolean }
        photoUrls:
          type: array
          description: Galeria do item. O cliente toca na foto para ver a próxima.
          items: { type: string }
    MenuItemInput:
      type: object
      required: [kind, name, priceCents, priceType]
      properties:
        kind: { $ref: '#/components/schemas/ItemKind' }
        group: { $ref: '#/components/schemas/ServiceGroup' }
        name: { type: string }
        description: { type: string }
        priceCents: { type: integer, minimum: 1 }
        priceType: { type: string, enum: [fixed, from] }
        durationMinutes: { type: integer, default: 30 }
        visible: { type: boolean, default: true }
        photoUrls: { type: array, items: { type: string } }
    Contacts:
      type: object
      properties:
        whatsapp: { type: string, description: E.164 }
        instagramUrl: { type: string }
        mapsUrl: { type: string }
    TimeRange:
      type: object
      required: [start, end]
      properties:
        start: { type: string, example: '09:00' }
        end: { type: string, example: '12:00' }
    HourException:
      type: object
      required: [date, ranges]
      properties:
        date: { type: string, format: date }
        ranges:
          type: array
          description: Vazio significa fechado no dia.
          items: { $ref: '#/components/schemas/TimeRange' }
    Settings:
      type: object
      properties:
        defaultHours:
          type: array
          description: Mais de uma faixa no mesmo dia vira pausa (almoço).
          items: { $ref: '#/components/schemas/TimeRange' }
        hourExceptions:
          type: array
          items: { $ref: '#/components/schemas/HourException' }
        notice: { type: string, nullable: true, description: Aviso do dia. }
        noticeDate:
          type: string
          format: date
          nullable: true
          description: Dia em que o aviso vale. Fora dele o aviso não aparece.
        horizonWeeks: { type: integer, default: 4, description: Semanas de agenda abertas ao cliente. }
        slotMinutes: { type: integer, default: 30, description: Tamanho do horário na grade. }
        maxServiceMinutes: { type: integer, default: 60, description: Teto de um atendimento. }
        cancelDeadlineHours:
          type: integer
          description: Aviso mínimo para cancelar ou remarcar. Abaixo disso, cobra-se o agendamento.
        absenceRule: { type: string, description: 'Texto mostrado ao cliente. {h} vira cancelDeadlineHours.' }
    Slot:
      type: object
      properties:
        startAt: { type: string, format: date-time }
        available: { type: boolean }
    CreateRequest:
      type: object
      required: [clientName, phone, itemIds, startAt, consent]
      properties:
        clientName: { type: string }
        phone: { type: string, description: E.164 }
        itemIds:
          type: array
          minItems: 1
          description: Só serviços, no máximo um por grupo. 400 VALIDATION_ERROR fora disso.
          items: { type: string }
        startAt: { type: string, format: date-time }
        consent:
          type: object
          required: [accepted, version]
          properties:
            accepted: { type: boolean }
            version: { type: string }
        honeypot: { type: string, description: Deve vir vazio }
    RequestStatus:
      type: string
      description: |
        Máquina de estados:
        pendente -> confirmado | recusado | outro_horario_proposto | cancelado
        outro_horario_proposto -> confirmado | cancelado
        confirmado -> atendido | cancelado | faltou
        recusado, cancelado, atendido e faltou são finais. Outra transição devolve 409 INVALID_TRANSITION.
        atendido e faltou só valem depois da hora marcada; antes disso, 409 INVALID_TRANSITION.
      enum: [pendente, confirmado, recusado, outro_horario_proposto, cancelado, atendido, faltou]
    RequestMessage:
      type: object
      description: |
        Mensagem que a API do WhatsApp mandou para o cliente, automaticamente, numa mudança de
        estado do pedido. Fica de registro no pedido e aparece para o cliente e para o dono.
      properties:
        at: { type: string, format: date-time }
        text: { type: string }
    PublicRequest:
      type: object
      properties:
        token: { type: string }
        status: { $ref: '#/components/schemas/RequestStatus' }
        itemIds: { type: array, items: { type: string } }
        durationMinutes: { type: integer }
        totalPriceCents: { type: integer }
        messages:
          type: array
          items: { $ref: '#/components/schemas/RequestMessage' }
        startAt: { type: string, format: date-time }
        proposedStartAt: { type: string, format: date-time, nullable: true }
        rescheduleStartAt: { type: string, format: date-time, nullable: true }
        cancelDeadlineAt: { type: string, format: date-time }
    AdminRequest:
      allOf:
        - $ref: '#/components/schemas/PublicRequest'
        - type: object
          properties:
            id: { type: string }
            clientName: { type: string }
            phone: { type: string }
            previousAbsences: { type: integer }
            manual: { type: boolean, description: Cadastrado pelo dono, nasce confirmado. }
            needsAdjust:
              type: boolean
              description: Caiu por mudança de horário feita no painel e espera o dono resolver.
            createdAt: { type: string, format: date-time }
            consentAcceptedAt: { type: string, format: date-time }
            consentVersion: { type: string }
    Client:
      type: object
      properties:
        phone: { type: string }
        name: { type: string }
        absences: { type: integer }
        totalRequests: { type: integer }
        blocked: { type: boolean }
  responses:
    Unauthorized:
      description: Não autenticado
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: UNAUTHORIZED, message: Credenciais inválidas } } }
    NotFound:
      description: Não encontrado
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: NOT_FOUND, message: Não encontrado } } }
    ValidationError:
      description: Dados inválidos
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: VALIDATION_ERROR, message: Dados inválidos, details: { field: phone } } } }
    SlotUnavailable:
      description: Horário indisponível
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: SLOT_UNAVAILABLE, message: Esse horário não está mais disponível } } }
    OutsideHours:
      description: Fora do horário de atendimento
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: OUTSIDE_BUSINESS_HOURS, message: Fora do horário de atendimento } } }
    DeadlinePassed:
      description: Prazo vencido
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: DEADLINE_PASSED, message: O prazo para alterar já passou } } }
    InvalidTransition:
      description: Transição inválida
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: INVALID_TRANSITION, message: Transição não permitida } } }
    TooManyRequests:
      description: Muitas tentativas
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: TOO_MANY_REQUESTS, message: Tente novamente mais tarde } } }
