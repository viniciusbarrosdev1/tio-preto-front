<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f2ea" />
    <meta name="description" content="Barbearia Tio Preto - cardápio, preços e agendamento." />
    <script>
      // pinta o tema antes do primeiro quadro, para não piscar branco quem escolheu o escuro
      try {
        if (localStorage.getItem('tio-preto-tema') === 'escuro') {
          document.documentElement.setAttribute('data-theme', 'dark')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#16110e')
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Barbearia Tio Preto</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
